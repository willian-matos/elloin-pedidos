<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Elloin Pedidos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<title>Elloin · Pedidos</title>
<style>
  /* Elloin Pedidos — visual executivo nas cores da marca. Compatível com iPhone/iPad (iOS 12+), Android 7+ e computador */
  :root{
    --marinho:#0A2540; --azul:#0070B8; --azul2:#005A94; --azul-claro:#EAF3FB; --verm:#E3141F;
    --navy:#0A2540; --navy2:#0A2540;
    --ouro:#F2A900; --ouro-claro:#EEF5FB;
    --fundo:#F4F6FA; --card:#FFFFFF; --linha:#E2E8F0; --linha2:#CDD6E3; --texto:#0F1B2D; --suave:#5B6B82;
    --ok:#0E7A55; --ok-bg:#E3F5EC; --erro:#C8231B; --erro-bg:#FDEDEB; --pend:#93610A; --pend-bg:#FFF5DB;
    --info:#0070B8; --info-bg:#E6F1FA; --raio:14px;
    --sombra:0 1px 2px rgba(15,27,45,.05),0 2px 8px rgba(15,27,45,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-font-smoothing:antialiased}
  .oculto{display:none!important}
  /* cabeçalho */
  header{background:#fff;color:var(--marinho);position:-webkit-sticky;position:sticky;top:0;z-index:5;border-top:3px solid var(--azul);box-shadow:0 1px 0 var(--linha),0 4px 14px rgba(15,27,45,.06)}
  .topo{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
  .marca-img{height:38px;width:auto;display:block}
  .marca{font-weight:700;font-size:16px;letter-spacing:-.1px;color:var(--marinho);padding-left:14px;border-left:1px solid var(--linha);line-height:1.25}
  .marca small{display:block;font-weight:500;color:var(--suave);font-size:12px;letter-spacing:.2px;text-transform:uppercase}
  .topo .esp{flex:1}
  .quem{font-size:13px;color:var(--suave);text-align:right;line-height:1.3}
  .quem b,.quem strong{color:var(--marinho)}
  .sairbtn{background:#fff;border:1px solid var(--linha2);color:var(--marinho);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
  .sairbtn:hover{border-color:var(--azul);color:var(--azul)}
  nav.abas{max-width:1040px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav.abas button{background:none;border:0;color:var(--suave);padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;font-size:15px}
  nav.abas button:hover{color:var(--marinho)}
  nav.abas button.ativo{color:var(--azul);border-bottom-color:var(--azul)}
  .bolha{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--verm);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center;margin-left:6px}
  main{max-width:1040px;margin:0 auto;padding:20px 18px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px;margin-bottom:16px;box-shadow:var(--sombra)}
  h2{font-size:19px;margin:0 0 14px;color:var(--marinho);letter-spacing:-.2px}
  h3{font-size:15px;margin:0 0 8px;color:var(--marinho)}
  .grade{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  .grade .tudo{grid-column:1/-1}
  @media (max-width:640px){.grade{grid-template-columns:1fr}.quem{display:none}.marca{display:none}.topo{padding:8px 14px}.marca-img{height:34px}main{padding:14px 12px}}
  label{display:block;font-size:13px;font-weight:600;color:#3B4A60;margin-bottom:5px}
  label .obr{color:var(--verm)}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--linha2);border-radius:10px;background:#fff;min-height:46px;font-size:16px;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
  select{background-image:linear-gradient(45deg,transparent 50%,#5B6B82 50%),linear-gradient(135deg,#5B6B82 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  input[type=date]{min-width:0;display:block}
  input[type=file]{padding:9px;font-size:14px;background:#FAFBFD;border-style:dashed}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,112,184,.18)}
  textarea{min-height:68px;resize:vertical}
  .dica{font-size:12.5px;color:var(--suave);margin-top:5px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:46px;text-decoration:none;letter-spacing:.1px;transition:background .15s,box-shadow .15s}
  .btn:disabled{opacity:.55;cursor:wait}
  .prim{background:var(--azul);color:#fff;box-shadow:0 1px 2px rgba(0,90,148,.3)}
  .prim:hover{background:var(--azul2)}
  .ouro{background:var(--ouro);color:#2E2100}
  .ouro:hover{background:#E09D00}
  .verde{background:var(--ok);color:#fff}
  .verm{background:var(--erro);color:#fff}
  .claro{background:#EEF2F7;color:var(--marinho);box-shadow:inset 0 0 0 1px var(--linha)}
  .claro:hover{background:#E4EAF2}
  .whats{background:#1FA855;color:#fff}
  .linkbtn{background:none;border:0;color:var(--azul);cursor:pointer;padding:6px 0;font-weight:600}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .acoes .btn{flex:1 1 160px}
  /* itens */
  .item{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 36px;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--linha)}
  .item .tot{font-weight:700;padding:10px 0;text-align:right;white-space:nowrap;color:var(--marinho);font-variant-numeric:tabular-nums}
  .item .x{background:none;border:0;color:var(--erro);font-size:22px;cursor:pointer;height:46px}
  @media (max-width:640px){
    .item{grid-template-columns:1fr 1fr;}
    .item .mod{grid-column:1/-1}
    .item .tot{text-align:left}
  }
  .seg{display:flex;flex-wrap:wrap;margin:0 -8px -8px 0}
  .seg button{flex:1 1 auto;min-width:64px;min-height:46px;margin:0 8px 8px 0;border:1px solid var(--linha2);background:#fff;border-radius:10px;font-weight:700;font-size:16px;color:var(--marinho);cursor:pointer;padding:8px 10px;transition:all .15s}
  .seg button.sel{background:var(--azul);color:#fff;border-color:var(--azul);box-shadow:0 2px 6px rgba(0,112,184,.25)}
  .numauto{background:var(--azul-claro);color:var(--marinho);border-radius:10px;padding:10px 14px;font-weight:700;min-height:46px;display:flex;align-items:center;letter-spacing:.3px}
  .numauto small{font-weight:500;color:var(--suave);margin-left:8px;letter-spacing:0}
  .item label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .total span{white-space:nowrap}
  .total span:first-child{white-space:normal;margin-right:12px}
  @media (max-width:360px){ .total{font-size:15px;padding:12px 10px} }
  .total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 16px;background:var(--marinho);color:#fff;border-radius:12px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  /* listas */
  .ped{border:1px solid var(--linha);border-radius:var(--raio);background:#fff;padding:16px;margin-bottom:14px;box-shadow:var(--sombra)}
  .ped .cab{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .ped .tit{font-weight:700;font-size:16.5px;color:var(--marinho);text-transform:capitalize}
  .ped .sub{color:var(--suave);font-size:13px}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
  .p-Pendente{background:var(--pend-bg);color:var(--pend)}
  .p-Aprovado{background:var(--info-bg);color:var(--info)}
  .p-Lançado{background:var(--ok-bg);color:var(--ok)}
  .p-Recusado{background:var(--erro-bg);color:var(--erro)}
  .p-Cancelado{background:#EEF1F5;color:#6B7280}
  .novo{background:var(--verm);color:#fff}
  table.it{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;font-variant-numeric:tabular-nums}
  table.it th{font-size:11.5px;color:var(--suave);text-align:left;font-weight:700;border-bottom:1px solid var(--linha2);padding:7px 6px;text-transform:uppercase;letter-spacing:.4px}
  table.it td{padding:8px 6px;border-bottom:1px solid #EEF1F6}
  table.it .n{text-align:right;white-space:nowrap}
  .motivo{margin-top:12px;background:var(--erro-bg);color:#7A1A12;border-left:4px solid var(--erro);border-radius:10px;padding:11px 14px}
  .aviso{margin-top:10px;background:var(--pend-bg);color:#6B4A00;border-radius:10px;padding:10px 12px;font-size:13px}
  .dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-top:12px;font-size:14px;background:#F8FAFC;border-radius:10px;padding:10px 12px}
  .dados b{display:block;color:var(--suave);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .filtros>*{flex:1 1 160px}
  .vazio{text-align:center;color:var(--suave);padding:32px 10px}
  /* entrada */
  #telaLogin{min-height:100vh;background:linear-gradient(180deg,var(--marinho) 0,#0B3A68 300px,var(--fundo) 300px)}
  .login{max-width:410px;margin:0 auto;padding:7vh 16px 30px}
  .login .logo{text-align:center;margin-bottom:18px;color:#fff}
  .login .logo div{font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;opacity:.92}
  .login .logo small{display:block;font-size:13px;opacity:.7;margin-top:2px}
  .login .card{padding:26px 24px;border:0;box-shadow:0 10px 30px rgba(10,37,64,.18)}
  .login .card .logo-img{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 18px}
  .login .card h1{font-size:18px;text-align:center;color:var(--marinho);margin:0 0 18px;font-weight:700}
  .login .rodape{text-align:center;color:var(--suave);font-size:12px;margin-top:22px;letter-spacing:.2px}
  #semApi{background:var(--pend-bg);color:#6B4A00;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px}
  /* mensagens */
  .msg{position:fixed;left:50%;bottom:18px;bottom:calc(18px + env(safe-area-inset-bottom));-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--marinho);color:#fff;padding:12px 18px;border-radius:12px;max-width:92vw;z-index:50;box-shadow:0 10px 30px rgba(10,37,64,.3);font-weight:500}
  .msg.erro{background:var(--erro)}
  .modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,37,64,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:14px}
  .modal .caixa{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;max-height:calc(100% - 10px);overflow:auto;-webkit-overflow-scrolling:touch;padding:22px;box-shadow:0 20px 50px rgba(10,37,64,.3)}
  .modal .caixa.larga{max-width:900px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chips button{border:1px solid var(--linha2);background:#fff;border-radius:18px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--marinho)}
  .chips button:hover{border-color:var(--azul);color:var(--azul)}
  .carregando{text-align:center;padding:60px 10px;color:var(--suave)}
  .anexo-ok{color:var(--ok);font-weight:600;font-size:13px;margin-top:6px}
  .semgap .topo>*{margin-left:12px}.semgap .topo>*:first-child{margin-left:0}
  .semgap .acoes>*,.semgap .filtros>*,.semgap .chips>*,.semgap .linha>*{margin:0 10px 10px 0}
  .semgap .ped .cab>*{margin:0 10px 6px 0}
  .semgap .btn>*{margin-left:6px}
  .linha{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  /* tablet */
  @media (min-width:700px) and (max-width:1100px){ main{padding:22px 24px} .acoes .btn{flex:0 1 auto;min-width:180px} }
  iframe.pdf{width:100%;height:70vh;border:1px solid var(--linha);border-radius:10px}
  img.foto{max-width:100%;border-radius:10px}

  /* ---- sem internet, tabela de preços, resumo */
  .faixa{max-width:1040px;margin:0 auto;padding:8px 18px;font-size:13px;font-weight:600}
  header .faixa.off{background:#FFF5DB;color:#6B4A00;max-width:none;border-top:1px solid #F5E2AE}
  header .faixa.info{background:var(--azul-claro);color:var(--azul2);max-width:none}
  header .faixa .linkbtn{padding:0 0 0 6px;font-size:13px}
  .dicainst{background:var(--azul-claro);color:var(--marinho);border:1px solid #CFE3F3;border-radius:12px;padding:11px 14px;margin:0 0 16px;font-size:14px}
  .dicainst .btn{min-height:36px;padding:6px 14px;margin-left:6px}
  .item .tabinfo{grid-column:1/-1;font-size:12.5px;color:var(--suave);margin-top:-4px}
  .item.abaixo .tabinfo{color:var(--erro);font-weight:700}
  .item.abaixo .iPreco{border-color:var(--erro);background:#FFF7F6}
  table.it tr.abaixo td{color:var(--erro);font-weight:600}
  .alerta{margin-top:12px;background:var(--erro-bg);color:#7A1A12;border-left:4px solid var(--erro);border-radius:10px;padding:11px 14px;font-size:14px}
  .ped.comalerta{border-color:#F3B7B0;box-shadow:0 0 0 3px #FDEDEB,var(--sombra)}
  .ped.local{border-style:dashed}
  .p-Aguardando,.p-Aguardando_sinal{background:#FFF5DB;color:#93610A}
  .p-Não_aceito{background:var(--erro-bg);color:var(--erro)}
  .bolha.verm{background:var(--verm);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .kpis>div{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px 16px;box-shadow:var(--sombra);border-top:3px solid var(--azul)}
  .kpis>div:first-child{background:var(--marinho);border-color:var(--marinho);border-top-color:var(--verm)}
  .kpis>div:first-child small,.kpis>div:first-child span{color:#B9C7DA}
  .kpis>div:first-child b{color:#fff}
  .kpis small{display:block;color:var(--suave);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .kpis b{display:block;font-size:24px;color:var(--marinho);margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .kpis span{font-size:12.5px;color:var(--suave)}
  body{padding-bottom:env(safe-area-inset-bottom)}
  header{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>

<!-- ============================================================ LOGIN -->
<section id="telaLogin" class="login oculto">
  <div class="logo"><div>Portal de Pedidos</div><small>Representantes e gestão de vendas</small></div>
  <div class="card">
    <img class="logo-img" src="logo.png" alt="Grupo Elloin Toalhas">
    <h1>Acesse sua conta</h1>
    <form id="fLogin">
      <div style="margin-bottom:12px"><label for="lLogin">Login</label><input id="lLogin" autocomplete="username" autocapitalize="none" required></div>
      <div style="margin-bottom:16px"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" required></div>
      <button class="btn prim" style="width:100%" id="bEntrar">Entrar</button>
    </form>
  </div>
  <p class="dica" style="text-align:center;margin-top:14px">Esqueceu a senha? Fale com o gestor de vendas.</p>
  <div id="semApi" class="oculto">Este app ainda não foi ligado ao servidor: falta colar o endereço no arquivo <b>config.js</b> (veja o LEIA-ME).</div>
  <p class="rodape">© Grupo Elloin Toalhas</p>
</section>

<!-- ============================================================ APP -->
<section id="telaApp" class="oculto">
  <header>
    <div class="topo">
      <img class="marca-img" src="logo-marca.png" alt="Elloin">
      <div class="marca">Portal de Pedidos<small id="subMarca">Pedidos</small></div>
      <div class="esp"></div>
      <div class="quem" id="quem"></div>
      <button class="sairbtn" id="bSair">Sair</button>
    </div>
    <nav class="abas" id="abas"></nav>
    <div id="faixa" class="faixa oculto"></div>
  </header>
  <main><div id="dicaInst" class="oculto"></div><div id="conteudo"><div class="carregando">Carregando…</div></div></main>
</section>

<div id="modal" class="modal oculto"><div class="caixa" id="modalCaixa"></div></div>
<div id="msg" class="msg oculto"></div>

<script src="config.js"></script>
<script>
/* ======================================================================
   ELLOIN · PEDIDOS — app dos representantes e do gestor
   Funciona sem internet: pedidos e clientes ficam guardados no aparelho
   e são enviados sozinhos quando o sinal volta.
   (JavaScript ES5: roda em iPhone/iPad com iOS 12+ e Android 7+)
   ====================================================================== */
var TOKEN = null, D = null, ABA_ATUAL = null, FILA_MEM = [], SINC = false, FORM_SUJO = false, ONLINE = true;
var API = String(window.ELLOIN_API || '').trim();
var ARMAZ = (function(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return localStorage; }catch(e){ return null; } })();
function guardar(k,v){ try{ if(ARMAZ){ v==null?ARMAZ.removeItem(k):ARMAZ.setItem(k,v); } }catch(e){} }
function ler(k){ try{ return ARMAZ?ARMAZ.getItem(k):null; }catch(e){ return null; } }

/* ---------------------------------------------------------------- servidor */
function chamar(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(ok,falha){
    if(!API || API.indexOf('COLE_AQUI')>=0){ var e0=new Error('O app ainda não tem o endereço do servidor (arquivo config.js).'); falha(e0); return; }
    var x = new XMLHttpRequest();
    try{ x.open('POST', API, true); }catch(e){ var e1=new Error('Endereço do servidor inválido.'); falha(e1); return; }
    x.setRequestHeader('Content-Type','text/plain;charset=utf-8');      // sem cabeçalho especial: o Google aceita de outro site
    x.timeout = fn==='enviarPedido' ? 180000 : 45000;
    x.onload = function(){
      var r, txt=String(x.responseText||'');
      if(x.status===404 || x.status===401 || x.status===403 || /accounts\.google\.com|ServiceLogin|signin/i.test(txt.slice(0,4000))){
        var ec=new Error('O app não conseguiu falar com o servidor: confira o endereço no config.js e se o Apps Script foi publicado para "Qualquer pessoa".'); ec.config=true; falha(ec); return; }
      try{ r = JSON.parse(txt); }catch(e){ var er=new Error('Sem sinal de internet (resposta incompleta).'); er.rede=true; marcarOnline(false); falha(er); return; }
      marcarOnline(true);
      if(r && r.erro && r.temporario){ var et=new Error('Servidor ocupado, tentando de novo em instantes.'); et.rede=true; falha(et); return; }
      if(r && r.erro){
        if(String(r.erro).indexOf('SESSAO')>=0){ sessaoExpirou(); falha(new Error('Sua sessão expirou. Entre de novo.')); return; }
        falha(new Error(String(r.erro).replace(/^Exception:\s*/,'').replace(/^Error:\s*/,''))); return;
      }
      ok(r ? r.ok : null);
    };
    x.onerror = x.ontimeout = function(){ var er=new Error('Sem sinal de internet.'); er.rede=true; marcarOnline(false); falha(er); };
    x.send(JSON.stringify({ fn: fn, args: args }));
  });
}
function marcarOnline(v){ if(ONLINE!==v){ ONLINE=v; faixa(); } }
function limparDadosLocais(){ guardar('elloin_dados',null); try{ if(ARMAZ){ for(var i=ARMAZ.length-1;i>=0;i--){ var k=ARMAZ.key(i); if(k && k.indexOf('elloin_resumo_')===0) ARMAZ.removeItem(k); } } }catch(e){} }
function sessaoExpirou(){ TOKEN=null; D=null; guardar('elloin_token',null); limparDadosLocais(); mostrarLogin(); }

/* ---------------------------------------------------------------- utilidades */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function milhar(s){ return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function rs(v){ var n=Math.round(Number(v||0)*100)/100, neg=n<0, p=Math.abs(n).toFixed(2).split('.'); return (neg?'-':'')+'R$ '+milhar(p[0])+','+p[1]; }
function nbr(v){ var n=Math.round(Number(v||0)*1000)/1000, p=String(Math.abs(n)).split('.'); return (n<0?'-':'')+milhar(p[0])+(p[1]?','+p[1]:''); }
function cada(lista,fn){ Array.prototype.forEach.call(lista,fn); }
function dbr(s){ if(!s) return ''; var p=String(s).split(' ')[0].split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : (p.length===2? p[1]+'/'+p[0] : s); }
function dhbr(s){ if(!s) return ''; var t=String(s).split(' '); return dbr(t[0]) + (t[1]?' '+t[1]:''); }
function num(v){ var s=String(v==null?'':v).trim().replace(/\s/g,''); if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); return s===''?NaN:Number(s); }
function dois(n){ return (n<10?'0':'')+n; }
function hojeLocal(){ var d=new Date(); return d.getFullYear()+'-'+dois(d.getMonth()+1)+'-'+dois(d.getDate()); }
function agoraLocal(){ var d=new Date(); return hojeLocal()+' '+dois(d.getHours())+':'+dois(d.getMinutes()); }
function normNome(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
function novoUid(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
var _tm;
function aviso(t,erro){ var m=$('msg'); m.textContent=t; m.className='msg'+(erro?' erro':''); clearTimeout(_tm); _tm=setTimeout(function(){m.className='msg oculto';}, erro?7000:4000); }
var URLS=[];
function abrirModal(html,larga){ $('modalCaixa').className='caixa'+(larga?' larga':''); $('modalCaixa').innerHTML=html; $('modal').className='modal'; }
function fecharModal(){ $('modal').className='modal oculto'; $('modalCaixa').innerHTML=''; while(URLS.length){ try{ URL.revokeObjectURL(URLS.pop()); }catch(e){} } }
$('modal').addEventListener('click',function(e){ if(e.target.id==='modal') fecharModal(); });
function ocupado(btn,sim,txt){ if(!btn) return; if(sim){ btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.innerHTML=txt||'Aguarde…'; } else { btn.disabled=false; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function pill(sit){ return '<span class="pill p-'+esc(sit).replace(/\s/g,'_')+'">'+esc(sit==='Lançado'?'Lançado na planilha':sit)+'</span>'; }
function semSinal(e){ return e && e.rede; }

/* ---------------------------------------------------------------- fila no aparelho (IndexedDB) */
var BANCO = null;
function abrirBanco(){
  return new Promise(function(ok){
    if(BANCO) return ok(BANCO);
    if(!window.indexedDB) return ok(null);
    var rq; try{ rq=indexedDB.open('elloin',1); }catch(e){ return ok(null); }
    rq.onupgradeneeded=function(){ try{ rq.result.createObjectStore('fila',{keyPath:'uid'}); }catch(e){} };
    rq.onsuccess=function(){ BANCO=rq.result; BANCO.onclose=function(){ BANCO=null; }; BANCO.onversionchange=function(){ try{ BANCO.close(); }catch(e){} BANCO=null; }; ok(BANCO); };
    rq.onerror=function(){ ok(null); };
  });
}
function transacao(modo){         // se o aparelho fechou o banco por trás (iPhone faz isso), abre de novo
  return abrirBanco().then(function(db){
    if(!db) return null;
    try{ return db.transaction('fila',modo); }catch(e){ BANCO=null; return abrirBanco().then(function(db2){ return db2 ? db2.transaction('fila',modo) : null; }); }
  });
}
function filaLer(){
  return transacao('readonly').then(function(t){ var db=t; 
    if(!db){ try{ return JSON.parse(ler('elloin_fila')||'[]'); }catch(e){ return []; } }
    return new Promise(function(ok){
      var out=[]; var c=t.objectStore('fila').openCursor();
      c.onsuccess=function(){ var cur=c.result; if(cur){ out.push(cur.value); cur['continue'](); } else ok(out); };
      c.onerror=function(){ ok(out); };
    });
  }).then(function(l){ l.sort(function(a,b){ return a.criado-b.criado; }); FILA_MEM=l; return l; });
}
function filaGravar(item){
  return transacao('readwrite').then(function(t){ var db=t;
    if(!db){ var l=FILA_MEM.filter(function(x){return x.uid!==item.uid;}); l.push(item); try{ ARMAZ.setItem('elloin_fila',JSON.stringify(l)); }catch(e){ throw new Error('Sem espaço no aparelho para guardar o pedido.'); } return; }
    return new Promise(function(ok,falha){ t.objectStore('fila').put(item); t.oncomplete=function(){ ok(); }; t.onerror=t.onabort=function(){ falha(new Error('Sem espaço no aparelho para guardar o pedido.')); }; });
  }).then(filaLer);
}
function filaTirar(uid){
  return transacao('readwrite').then(function(t){ var db=t;
    if(!db){ guardar('elloin_fila',JSON.stringify(FILA_MEM.filter(function(x){return x.uid!==uid;}))); return; }
    return new Promise(function(ok){ t.objectStore('fila')['delete'](uid); t.oncomplete=function(){ ok(); }; t.onerror=function(){ ok(); }; });
  }).then(filaLer);
}
function minhaFila(){ return D && D.eu ? FILA_MEM.filter(function(x){ return x.login===D.eu.login; }) : []; }
function pendentes(){ return minhaFila().filter(function(x){ return x.estado!=='erro'; }); }
function clienteTravado(nome){ return minhaFila().some(function(x){ return x.tipo==='cliente' && x.estado==='erro' && x.nomeLocal===nome; }); }

/* ---------------------------------------------------------------- sincronização */
function sincronizar(){
  if(SINC || !TOKEN || !D || !D.eu) return Promise.resolve();
  SINC=true; faixa();
  var msgs=[], mudou=false, parou=false, loginSinc=D.eu.login;
  return filaLer().then(function(){
    var cadeia=Promise.resolve();
    minhaFila().filter(function(x){ return x.estado!=='erro'; }).forEach(function(it){
      cadeia=cadeia.then(function(){
        if(parou || !D || D.eu.login!==loginSinc) return;
        if(it.tipo==='pedido' && clienteTravado(it.dados.cliente)) return;     // espera o cadastro do cliente ser corrigido
        var p = it.tipo==='cliente' ? chamar('cadastrarCliente',TOKEN,it.dados) : chamar('enviarPedido',TOKEN,it.dados,it.anexo);
        return p.then(function(r){
          mudou=true;
          if(it.tipo==='pedido'){
            if(r.numeroMudou) msgs.push('O pedido '+it.dados.numProposto+' foi enviado com o nº '+r.numero+' (o '+it.dados.numProposto+' já tinha sido usado em outro aparelho).');
            if(!D.pedidos.some(function(p){ return p.id===r.id; })){        // aparece em Meus pedidos mesmo se a lista não recarregar
              var ped=pedidoDaFila(it); ped.local=false; ped.id=r.id; ped.sit='Pendente'; ped.numRep=r.numero; ped.uid=it.uid; ped.mes=it.dados.data.slice(0,7); ped.alerta=r.alerta||''; ped.forma=it.dados.forma; ped.prazo=it.dados.prazo;
              D.pedidos.unshift(ped); guardar('elloin_dados',JSON.stringify(D));
            }
          }
          return filaTirar(it.uid);
        }, function(e){
          if(semSinal(e)){ parou=true; return; }
          if(!TOKEN){ parou=true; return; }
          it.estado='erro'; it.erro=e.message; msgs.push((it.tipo==='cliente'?'Cliente ':'Pedido ')+(it.dados.numProposto||it.dados.fantasia||'')+' não foi aceito: '+e.message);
          return filaGravar(it);
        });
      });
    });
    return cadeia;
  }).then(function(){
    if(mudou) return chamar('carregar',TOKEN).then(aplicarDados).catch(function(){});
  }).then(function(){ SINC=false; faixa(); if(msgs.length) aviso(msgs.join(' '), msgs.join('').indexOf('não foi aceito')>=0); if(mudou||msgs.length) redesenhar(); return mudou; },
          function(){ SINC=false; faixa(); });
}
window.addEventListener('online',function(){ marcarOnline(true); sincronizar(); });
window.addEventListener('offline',function(){ marcarOnline(false); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && TOKEN){ sincronizar(); } });
setInterval(function(){ if(TOKEN && pendentes().length) sincronizar(); }, 30000);

function faixa(){
  var f=$('faixa'); if(!f) return;
  var n=pendentes().length, nErr=minhaFila().length-n;
  var txt='', cls='faixa';
  if(SINC){ txt='Enviando o que está guardado no aparelho…'; cls+=' info'; }
  else if(!ONLINE){ txt='Sem sinal. '+(n?n+' item(ns) guardado(s) no aparelho: vão ser enviados quando o sinal voltar.':'Você pode lançar pedidos normalmente: eles ficam guardados no aparelho.'); cls+=' off'; }
  else if(n){ txt=n+' item(ns) guardado(s) no aparelho aguardando envio.'; cls+=' off'; }
  if(nErr) txt+=(txt?' ':'')+nErr+' item(ns) não aceito(s): veja em Meus pedidos.';
  f.className = txt ? cls : 'faixa oculto';
  f.innerHTML = txt ? esc(txt)+(n&&!SINC&&ONLINE?' <button class="linkbtn" onclick="sincronizar()">Enviar agora</button>':'') : '';
}

/* ---------------------------------------------------------------- dados (guardados no aparelho para abrir sem sinal) */
function aplicarDados(d){
  D=d; d._token=TOKEN; guardar('elloin_dados',JSON.stringify(d));
  var seqLoc=Number(ler('elloin_seq_'+d.eu.login)||0); if(d.seq>seqLoc) guardar('elloin_seq_'+d.eu.login,String(d.seq));
  montarAbas();
}
function dadosGuardados(){ try{ var d=JSON.parse(ler('elloin_dados')||'null'); return d && d.eu && d._token===TOKEN ? d : null; }catch(e){ return null; } }   // só os dados de quem está logado
function redesenhar(){
  if(!D) return;
  montarAbas();
  if(FORM_SUJO) return;            // não apaga o que a pessoa está digitando ou mudou na tela (formulário, mês da aprovação, tabela)
  irPara(ABA_ATUAL, true);
}

/* ---------------------------------------------------------------- login */
function mostrarLogin(){ $('telaApp').className='oculto'; $('telaLogin').className='login';
  if(!API || API.indexOf('COLE_AQUI')>=0) $('semApi').className='aviso';
  if(!('ontouchstart' in window) && !$('lLogin').value) setTimeout(function(){ if(document.activeElement===document.body) $('lLogin').focus(); },50); }
$('fLogin').addEventListener('submit',function(e){
  e.preventDefault(); var b=$('bEntrar'); ocupado(b,true,'Entrando…');
  chamar('entrar',$('lLogin').value,$('lSenha').value).then(function(r){
    TOKEN=r.token; guardar('elloin_token',TOKEN); $('lSenha').value=''; return iniciar();
  }).catch(function(e){ aviso(semSinal(e)?'Sem sinal: para entrar é preciso ter internet (só na primeira vez ou depois de sair).':e.message,true); }).then(function(){ ocupado(b,false); });
});
$('bSair').addEventListener('click',function(){
  var n=pendentes().length;
  if(n && !confirm('Há '+n+' item(ns) ainda não enviado(s). Eles continuam guardados neste aparelho e vão quando você entrar de novo com sinal. Sair mesmo assim?')) return;
  chamar('sair',TOKEN).catch(function(){}); TOKEN=null; guardar('elloin_token',null); limparDadosLocais(); D=null; mostrarLogin(); });

function iniciar(){
  $('telaLogin').className='login oculto'; $('telaApp').className='';
  var guard=dadosGuardados();
  if(!guard) D=null;
  return filaLer().then(function(){
    if(guard){ D=guard; cabecalho(); montarAbas(); irPara(ABA_ATUAL && abasValidas().indexOf(ABA_ATUAL)>=0 ? ABA_ATUAL : abasValidas()[0]); faixa(); }
    else $('conteudo').innerHTML='<div class="carregando">Carregando…</div>';
    return chamar('carregar',TOKEN).then(function(d){
      var trocouUsuario = !guard || guard.eu.login!==d.eu.login;
      aplicarDados(d); cabecalho();
      if(trocouUsuario) irPara(abasValidas()[0]); else redesenhar();
      faixa(); return sincronizar();
    }).catch(function(e){
      if(!TOKEN) return;
      if(semSinal(e) && guard){ faixa(); return; }
      $('conteudo').innerHTML='<div class="card vazio">'+(semSinal(e)?'Sem sinal de internet. Na primeira vez o app precisa de sinal para baixar seus clientes e modelos.':'Não carregou: '+esc(e.message))+'<br><br><button class="btn prim" onclick="iniciar()">Tentar de novo</button></div>';
    });
  });
}
function cabecalho(){
  $('quem').innerHTML=esc(D.eu.nome)+'<br><small>'+(D.eu.perfil==='gestor'?'Gestor de vendas':'Representante')+'</small>';
  $('subMarca').textContent = D.eu.perfil==='gestor' ? 'Aprovação de pedidos' : 'Pedidos de representantes';
  dicaInstalar();
}
function recarregar(){ return chamar('carregar',TOKEN).then(function(d){ aplicarDados(d); irPara(ABA_ATUAL,true); }); }

function abasValidas(){ return D.eu.perfil==='gestor' ? ['aprovar','historico','resumo','precos','usuarios'] : ['novo','meus','resumo']; }
function montarAbas(){
  var nomes, n;
  if(D.eu.perfil==='gestor'){
    n=D.pedidos.filter(function(p){return p.sit==='Pendente';}).length;
    var nA=D.pedidos.filter(function(p){return p.sit==='Pendente' && p.alerta;}).length;
    nomes={aprovar:'Para aprovar'+(n?'<span class="bolha'+(nA?' verm':'')+'">'+n+'</span>':''),historico:'Todos os pedidos',resumo:'Resumo de vendas',precos:'Tabela de preços',usuarios:'Representantes'};
  } else {
    n=D.pedidos.filter(function(p){return p.sit==='Recusado' && !p.reenviado;}).length + minhaFila().length;
    nomes={novo:'Novo pedido',meus:'Meus pedidos'+(n?'<span class="bolha">'+n+'</span>':''),resumo:'Meu resumo'};
  }
  $('abas').innerHTML = abasValidas().map(function(a){ return '<button data-a="'+a+'" class="'+(a===ABA_ATUAL?'ativo':'')+'">'+nomes[a]+'</button>'; }).join('');
  cada($('abas').children,function(b){ b.onclick=function(){ irPara(b.getAttribute('data-a')); }; });
}
function irPara(a, manterRolagem){
  if(abasValidas().indexOf(a)<0) a=abasValidas()[0];
  ABA_ATUAL=a; FORM_SUJO=false;
  cada($('abas').children,function(b){ b.className = b.getAttribute('data-a')===a?'ativo':''; });
  ({novo:telaNovo,meus:telaMeus,resumo:telaResumo,aprovar:telaAprovar,historico:telaHistorico,precos:telaPrecos,usuarios:telaUsuarios})[a]();
  if(!manterRolagem) window.scrollTo(0,0);
}

/* ---------------------------------------------------------------- REPRESENTANTE: novo pedido */
var RASCUNHO=null, ANEXO=null;
function clientesVisiveis(){
  var l=(D.clientes||[]).slice(), nomes={};
  l.forEach(function(c){ nomes[c.nome]=1; });
  minhaFila().forEach(function(it){ if(it.tipo==='cliente' && !nomes[it.nomeLocal]){ l.push({nome:it.nomeLocal, razao:String(it.dados.razao||'').toUpperCase(), doc:it.dados.doc, cidade:it.dados.cidade+' / '+it.dados.uf, novo:true, local:true}); } });
  return l.sort(function(a,b){ return a.nome<b.nome?-1:1; });
}
function opcoesClientes(sel){
  return '<option value="">Escolha o cliente…</option>' + clientesVisiveis().map(function(c){
    return '<option value="'+esc(c.nome)+'"'+(c.nome===sel?' selected':'')+'>'+esc(c.nome.replace(/^[^\/]*\//,''))+(c.local?'  (novo, guardado no aparelho)':c.novo?'  (novo)':'')+'</option>';
  }).join('') + '<option value="__novo">+ Cadastrar cliente novo</option>';
}
function opcoesModelos(sel){
  return '<option value="">Modelo…</option>' + D.modelos.map(function(m){ return '<option'+(m.nome===sel?' selected':'')+'>'+esc(m.nome)+'</option>'; }).join('');
}
function precoTabela(modelo){ var t=D.tabela||{}; var v=t[normNome(modelo)]; return v>0 ? v : null; }
// nº do pedido: sequência do representante; sem sinal, o aparelho reserva o próximo
function seqLocal(){
  var s=Math.max(Number(D.seq||0), Number(ler('elloin_seq_'+D.eu.login)||0));
  minhaFila().forEach(function(it){ if(it.tipo==='pedido' && it.dados.numProposto){ var n=Number(String(it.dados.numProposto).split('-').pop()); if(n>s) s=n; } });
  return s;
}
function fmtNumero(n){ var s=String(n); while(s.length<4) s='0'+s; return (D.prefixo||'PED')+'-'+s; }

        '<div class="dica" id="pCliInfo"></div></div>'+
      '<div class="tudo"><label>Nº do pedido</label><div class="numauto" id="pNum">'+esc(numMostrado)+'<small>'+(r.deId?'(mesmo nº do pedido recusado)':'(automático)')+'</small></div></div>'+
      '<div class="tudo"><label>Forma de pagamento <span class="obr">*</span></label><div class="seg" id="pForma">'+D.formas.map(function(f){return '<button type="button" data-v="'+esc(f)+'"'+(r.forma===f?' class="sel"':'')+'>'+esc(f)+'</button>';}).join('')+'</div></div>'+
      '<div class="tudo"><label>Prazo (dias) <span class="obr">*</span></label><div class="seg" id="pPrazo">'+D.prazos.map(function(f){return '<button type="button" data-v="'+esc(f)+'"'+(r.prazo===f?' class="sel"':'')+'>'+esc(f)+'</button>';}).join('')+'</div></div>'+
      '<div><label>Data do pedido <span class="obr">*</span></label><input id="pData" type="date" max="'+hojeLocal()+'" value="'+esc(r.data||hojeLocal())+'"></div>'+
      '<div><label>Data da entrega <span class="obr">*</span></label><input id="pEntrega" type="date" value="'+esc(r.entrega||'')+'"><div class="dica">Previsão combinada com o cliente</div></div>'+
    '</div>'+
    '<h3 style="margin-top:18px">Itens</h3><div id="pItens"></div>'+
    '<button type="button" class="linkbtn" id="pMais">+ adicionar item</button>'+
    '<div class="total"><span>Total do pedido</span><span id="pTotal">R$ 0,00</span></div>'+
    '<div class="grade" style="margin-top:14px">'+
      '<div class="tudo"><label>Observação</label><textarea id="pObs" maxlength="300">'+esc(r.obs||'')+'</textarea></div>'+
      '<div class="tudo"><label>PDF ou foto do pedido <span class="obr">*</span></label><input id="pAnexo" type="file" accept="application/pdf,image/*">'+

    '</div>'+
    '<div class="acoes">'+(r.deId||r.filaUid?'<button type="button" class="btn claro" id="pDescartar">Descartar correção</button>':'')+
      '<button class="btn prim" id="pEnviar">Enviar para aprovação</button></div>'+
  '</form>';
  ANEXO=r.anexo||null;
  (r.itens&&r.itens.length?r.itens:[{}]).forEach(function(it){ addItem(it); });
  $('pMais').onclick=function(){ addItem({}); };
  cada([$('pForma'),$('pPrazo')],function(g){ cada(g.querySelectorAll('button'),function(b){ b.onclick=function(){ cada(g.querySelectorAll('button'),function(x){ x.className=''; }); b.className='sel'; FORM_SUJO=true; }; }); });
  $('pCliente').onchange=function(){ if(this.value==='__novo'){ this.value=''; modalCliente(); } infoCliente(); FORM_SUJO=true; };
  $('pData').onchange=function(){ $('pEntrega').min=this.value; };
  $('pEntrega').min=$('pData').value;
  $('pAnexo').onchange=lerAnexo;
  if($('pDescartar')) $('pDescartar').onclick=function(){ RASCUNHO=null; FORM_SUJO=false; telaNovo(); };
  $('fPed').onsubmit=enviarPedido;
  infoCliente(); somar();
}
function infoCliente(){
  var c=clientesVisiveis().filter(function(x){return x.nome===$('pCliente').value;})[0];
  $('pCliInfo').innerHTML = c ? esc([c.razao,c.doc,c.cidade].filter(String).join(' · ')) + (c.local?' <span class="pill p-Aguardando">GUARDADO NO APARELHO</span>':c.novo?' <span class="pill novo">NOVO</span>':'') : '';
}
function escolhido(id){ var b=$(id).querySelector('button.sel'); return b?b.getAttribute('data-v'):''; }
// valor em reais: a pessoa digita só os números (1750 -> 17,50)
function mascaraValor(inp){ var d=inp.value.replace(/\D/g,'').replace(/^0+/,''); if(!d){ inp.value=''; return; } while(d.length<3) d='0'+d;
  inp.value=milhar(d.slice(0,-2))+','+d.slice(-2); }
function mascaraQtd(inp){ var d=inp.value.replace(/\D/g,'').replace(/^0+/,''); inp.value=d?milhar(d):''; }
function fmtValor(v){ return rs(v).replace('R$ ',''); }
function addItem(it){
  var d=document.createElement('div'); d.className='item';
  d.innerHTML='<div class="mod"><label>Modelo</label><select class="iMod">'+opcoesModelos(it.modelo)+'</select></div>'+
    '<div><label>Qtd (peças)</label><input class="iQtd" inputmode="numeric" pattern="[0-9]*" value="'+(it.qtd!=null&&it.qtd!==''?esc(milhar(String(Math.round(num(it.qtd))))):'')+'"></div>'+
    '<div><label>Valor da toalha</label><input class="iPreco" inputmode="numeric" pattern="[0-9]*" placeholder="0,00" value="'+(it.preco!=null&&it.preco!==''?esc(fmtValor(num(it.preco))):'')+'"></div>'+
    '<div class="tot">—</div><button type="button" class="x" title="remover">×</button><div class="tabinfo"></div>';
  $('pItens').appendChild(d);
  d.querySelector('.x').onclick=function(){ if($('pItens').children.length>1){ d.parentNode.removeChild(d); somar(); } else { cada(d.querySelectorAll('input'),function(i){i.value='';}); d.querySelector('select').value=''; somar(); } };

function lerAnexo(){
  var inp=this, f=inp.files[0]; ANEXO=null; $('pAnexoInfo').textContent='';
  if(!f) return;
  if(f.size>10*1048576){ aviso('Arquivo maior que 10 MB.',true); inp.value=''; return; }
  var tipo=f.type||'', ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!tipo || tipo==='application/octet-stream') tipo = ext==='pdf'?'application/pdf': (ext==='jpg'||ext==='jpeg')?'image/jpeg': ext==='png'?'image/png': ext==='heic'?'image/heic': ext==='webp'?'image/webp':'';
  if(!/^(application\/pdf|image\/(jpeg|png|webp|heic|heif))$/.test(tipo)){ aviso('Envie PDF ou foto (JPG/PNG).',true); inp.value=''; return; }
  var fim=function(b64,t){ ANEXO={base64:b64,tipo:t,nome:f.name}; $('pAnexoInfo').textContent='✓ '+f.name+' anexado'; FORM_SUJO=true; };
  var giraSozinho=false; try{ giraSozinho = !!(window.CSS && CSS.supports && CSS.supports('image-orientation','from-image')); }catch(e){}
  if(/^image\/(jpeg|png|webp)$/.test(tipo) && f.size>700000 && giraSozinho){        // foto grande: reduz (aparelho antigo manda a original para não ficar deitada)
    var img=new Image(), url=URL.createObjectURL(f);
    img.onload=function(){ var m=1800, k=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); fim(c.toDataURL('image/jpeg',0.82).split(',')[1],'image/jpeg'); };
    img.onerror=function(){ URL.revokeObjectURL(url); lerBruto(); };
    img.src=url;
  } else lerBruto();
  function lerBruto(){ var fr=new FileReader(); fr.onload=function(){ fim(String(fr.result).split(',')[1], tipo); }; fr.readAsDataURL(f); }
}

function buscarCep(cep){

  try{
    var x=new XMLHttpRequest(); x.open('GET','https://viacep.com.br/ws/'+cep+'/json/',true); x.timeout=6000;
    x.onload=function(){ try{ var j=JSON.parse(x.responseText); if(j.erro) { aviso('CEP não encontrado. Confira ou preencha o endereço.',true); return; }
      if(j.logradouro && !$('cEnd').value) $('cEnd').value=j.logradouro; if(j.bairro && !$('cBairro').value) $('cBairro').value=j.bairro;
      if(j.localidade) $('cCid').value=j.localidade; if(j.uf) $('cUf').value=j.uf; if(!$('cNum').value) $('cNum').focus(); }catch(e){} };
    x.send();
  }catch(e){}
}

  RASCUNHO={deId:id,cliente:p.cliente,numRep:p.numRep,forma:p.forma,prazo:p.prazo,data:p.data,entrega:p.entrega,obs:p.obs,itens:p.itens.map(function(i){return {modelo:i.modelo,qtd:i.qtd,preco:i.preco};})};
  irPara('novo'); aviso('Corrija o que foi pedido e anexe o PDF de novo.');
}
function corrigirCliente(uid){
  var it=FILA_MEM.filter(function(x){return x.uid===uid;})[0]; if(!it) return;
  irPara('novo'); modalCliente(it);
}
function corrigirFila(uid){ var it=FILA_MEM.filter(function(x){return x.uid===uid;})[0]; if(!it) return; RASCUNHO=rascunhoDaFila(it); irPara('novo'); }
function descartarFila(uid){ if(!confirm('Tirar este item do aparelho? Ele não será enviado.')) return; filaTirar(uid).then(function(){ montarAbas(); faixa(); irPara(ABA_ATUAL,true); }); }
function cancelar(id,b){
  if(!confirm('Cancelar este pedido?')) return;
  ocupado(b,true); chamar('cancelarPedido',TOKEN,id).then(function(){ aviso('Pedido cancelado.'); return recarregar(); })
    .catch(function(e){ aviso(semSinal(e)?'Sem sinal: para cancelar é preciso internet.':e.message,true); ocupado(b,false); });
}
function verAnexo(id,b){
  ocupado(b,true,'Abrindo…');
  chamar('linkAnexo',TOKEN,id).then(function(a){
    var bin=atob(a.base64), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:a.tipo})); URLS.push(url);
    var pdf=a.tipo==='application/pdf';
    abrirModal('<div class="linha" style="margin-bottom:10px"><h3 style="margin:0;word-break:break-all">'+esc(a.nome)+'</h3>'+
      '<button class="btn claro" onclick="fecharModal()">Fechar</button></div>'+
      (pdf?'<div id="pdfPaginas" class="dica">Carregando o PDF…</div>':'<img class="foto" src="'+url+'">')+
      '<div class="acoes"><a class="btn prim" href="'+url+'" download="'+esc(a.nome)+'" target="_blank" rel="noopener">Abrir / baixar</a>'+
      (a.drive?'<a class="btn claro" href="'+esc(a.drive)+'" target="_blank" rel="noopener">Abrir no Google Drive</a>':'')+'</div>', true);
    if(pdf) desenharPdf(u);
  }).catch(function(e){ aviso(semSinal(e)?'Sem sinal: para ver o anexo é preciso internet.':e.message,true); }).then(function(){ ocupado(b,false); });
}
// PDF desenhado na tela (funciona também no celular, onde o navegador não abre PDF dentro do app)
var PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/';
function carregarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function(ok,falha){ var s=document.createElement('script'); s.src=PDFJS+'pdf.min.js';
    s.onload=function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; ok(window.pdfjsLib); }; s.onerror=falha; document.head.appendChild(s); });
}
function desenharPdf(bytes){
  var alvo=$('pdfPaginas');
  carregarPdfJs().then(function(lib){ return lib.getDocument({data:bytes}).promise; }).then(function(doc){
    alvo.className=''; alvo.innerHTML='';
    var n=Math.min(doc.numPages,6), cadeia=Promise.resolve();
    for(var p=1;p<=n;p++) (function(p){ cadeia=cadeia.then(function(){ return doc.getPage(p); }).then(function(pg){
      var larg=Math.min(alvo.clientWidth||800,1000), v1=pg.getViewport({scale:1}), esc_=larg/v1.width*(window.devicePixelRatio||1), vp=pg.getViewport({scale:esc_});
      var c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width='100%'; c.style.border='1px solid #DCE2EC'; c.style.borderRadius='8px'; c.style.marginBottom='8px';
      alvo.appendChild(c); return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; }); })(p);
    if(doc.numPages>n) cadeia.then(function(){ alvo.insertAdjacentHTML('beforeend','<p class="dica">Mostrando 6 de '+doc.numPages+' páginas. Baixe para ver tudo.</p>'); });
  }).catch(function(){ if(alvo) alvo.innerHTML='Não deu para mostrar o PDF aqui. Use o botão Abrir / baixar.'; });
}

/* ---------------------------------------------------------------- RESUMO DE VENDAS (representante: o dele; gestor: todos) */
var NOMES_MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function opcoesMes(sel){
  var h=hojeLocal(), a=Number(h.slice(0,4)), m=Number(h.slice(5,7)), out='';
  for(var k=0;k<14;k++){ var v=a+'-'+dois(m); out+='<option value="'+v+'"'+(v===sel?' selected':'')+'>'+NOMES_MES[m-1]+'/'+a+'</option>'; m--; if(m<1){m=12;a--;} }
  if(sel && out.indexOf('value="'+sel+'"')<0) out='<option value="'+esc(sel)+'" selected>'+esc(dbr(sel))+'</option>'+out;
  return out;
}
function resumoLocal(mes){            // sem sinal: calcula com os pedidos guardados no aparelho
  var o={login:D.eu.login,nome:D.eu.nome,vendido:0,pedidos:0,pecas:0,pendente:0,nPend:0,recusados:0,abaixo:0,clientes:{},modelos:{}};
  D.pedidos.forEach(function(p){
    if(p.mes!==mes) return;
    if(p.sit==='Aprovado'||p.sit==='Lançado'){ o.vendido+=p.total; o.pedidos++; if(p.alerta) o.abaixo++; o.clientes[p.cliente]=(o.clientes[p.cliente]||0)+p.total;
      p.itens.forEach(function(i){ o.pecas+=i.qtd; var m=o.modelos[i.modelo]=o.modelos[i.modelo]||{qtd:0,valor:0}; m.qtd+=i.qtd; m.valor+=i.total; }); }
    else if(p.sit==='Pendente'){ o.pendente+=p.total; o.nPend++; } else if(p.sit==='Recusado' && !p.reenviado) o.recusados++;
  });
  o.clientes=Object.keys(o.clientes).map(function(c){return {cliente:c,valor:o.clientes[c]};}).sort(function(a,b){return b.valor-a.valor;}).slice(0,10);
  o.modelos=Object.keys(o.modelos).map(function(m){return {modelo:m,qtd:o.modelos[m].qtd,valor:o.modelos[m].valor};}).sort(function(a,b){return b.valor-a.valor;});
  return {mes:mes, reps:o.pedidos||o.nPend||o.recusados?[o]:[], total:o.vendido, local:true};
}
function telaResumo(){
  var mes=ler('elloin_resumo_mes')||hojeLocal().slice(0,7);
  $('conteudo').innerHTML='<div class="filtros"><select id="rMes">'+opcoesMes(mes)+'</select></div><div id="rCorpo"><div class="carregando">Calculando…</div></div>';
  $('rMes').onchange=function(){ guardar('elloin_resumo_mes',this.value); telaResumo(); };
  var chaveR='elloin_resumo_'+D.eu.login+'_'+mes;
  chamar('resumo',TOKEN,mes).then(function(r){ guardar(chaveR, JSON.stringify(r)); desenharResumo(r); })
    .catch(function(e){
      var g=null; try{ g=JSON.parse(ler(chaveR)||'null'); }catch(x){}
      if(g){ g.guardado=true; desenharResumo(g); }
      else if(D.eu.perfil==='rep' && semSinal(e)) desenharResumo(resumoLocal(mes));
      else $('rCorpo').innerHTML='<div class="card vazio">'+(semSinal(e)?'Sem sinal: o resumo precisa de internet.':esc(e.message))+'</div>';
    });
}
function desenharResumo(r){
  var aviso_ = r.guardado||r.local ? '<p class="dica">Sem sinal: mostrando o último resumo guardado no aparelho.</p>' : '';
  var nomeMes = NOMES_MES[Number(r.mes.slice(5,7))-1]+'/'+r.mes.slice(0,4);
  if(D.eu.perfil==='rep'){
    var o=r.reps[0]||{vendido:0,pedidos:0,pecas:0,pendente:0,nPend:0,recusados:0,abaixo:0,clientes:[],modelos:[]};
    $('rCorpo').innerHTML=aviso_+
      '<div class="kpis"><div><small>Vendido em '+nomeMes+'</small><b>'+rs(o.vendido)+'</b><span>aprovados e lançados</span></div>'+
      '<div><small>Pedidos</small><b>'+o.pedidos+'</b><span>'+nbr(o.pecas)+' peças</span></div>'+
      '<div><small>Aguardando aprovação</small><b>'+rs(o.pendente)+'</b><span>'+o.nPend+' pedido(s)</span></div>'+
      '<div><small>Recusados</small><b>'+o.recusados+'</b><span>'+(o.abaixo?o.abaixo+' aprovado(s) abaixo da tabela':'para corrigir')+'</span></div></div>'+
      tabelaResumo('Por cliente',['Cliente','Valor'],o.clientes.map(function(c){return [esc(c.cliente.replace(/^[^\/]*\//,'')),rs(c.valor)];}))+
      tabelaResumo('Por modelo',['Modelo','Peças','Valor'],o.modelos.map(function(m){return [esc(m.modelo),nbr(m.qtd),rs(m.valor)];}));
  } else {
    $('rCorpo').innerHTML=aviso_+
      '<div class="kpis"><div><small>Vendido em '+nomeMes+' (todos)</small><b>'+rs(r.total)+'</b><span>aprovados e lançados</span></div>'+
      '<div><small>Aguardando aprovação</small><b>'+rs(r.reps.reduce(function(s,o){return s+o.pendente;},0))+'</b><span>'+r.reps.reduce(function(s,o){return s+o.nPend;},0)+' pedido(s)</span></div></div>'+
      tabelaResumo('Por representante',['Representante','Vendido','Pedidos','Peças','Aguardando','Abaixo da tabela'],
        r.reps.map(function(o){return [esc(o.nome),rs(o.vendido),o.pedidos,nbr(o.pecas),rs(o.pendente)+' ('+o.nPend+')',o.abaixo||'—'];}).concat(r.reps.length?[['<b>Total</b>','<b>'+rs(r.total)+'</b>','','','','']]:[]));
  }
}
function tabelaResumo(titulo,cab,linhas){
  return '<div class="card"><h3>'+titulo+'</h3>'+(linhas.length?'<table class="it"><tr>'+cab.map(function(c,k){return '<th'+(k?' class="n"':'')+'>'+c+'</th>';}).join('')+'</tr>'+
    linhas.map(function(l){return '<tr>'+l.map(function(c,k){return '<td'+(k?' class="n"':'')+'>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</table>':'<p class="dica">Nada neste mês.</p>')+'</div>';

    '<div class="dados"><div><b>Data do pedido</b>'+dbr(p.data)+'</div><div><b>Entrega</b>'+dbr(p.entrega)+'</div><div><b>Competência</b>'+dbr(p.mes)+'</div><div><b>Pagamento</b>'+esc(p.cond||'—')+'</div></div>'+
    (p.obs?'<div class="dica" style="margin-top:8px"><b>Obs.:</b> '+esc(p.obs)+'</div>':'')+
    blocoItens(p, true)+
    (p.sit==='Recusado'?'<div class="motivo"><b>Motivo:</b> '+esc(p.motivo)+'<br><small>'+esc(p.decPor)+' · '+dhbr(p.decEm)+'</small></div>':'')+

function aprovar(id,b){
  var p=D.pedidos.filter(function(x){return x.id===id;})[0];
  if(p && p.alerta && !confirm('ATENÇÃO: preço abaixo da tabela.\n\n'+p.alerta+'\n\nAprovar mesmo assim? (Para o representante corrigir, use Recusar.)')) return;
  ocupado(b,true,'Aprovando…');
  chamar('decidir',TOKEN,id,true,'',{mes:$('aj_mes_'+id).value,entrega:$('aj_ent_'+id).value}).then(function(r){
    posDecisao(id,r,'aprovado');
  }).catch(function(e){ aviso(semSinal(e)?'Sem sinal: para aprovar é preciso internet.':e.message,true); ocupado(b,false); });
}

    '<div class="acoes"><button class="btn claro" onclick="fecharModal()">Voltar</button><button class="btn verm" id="rOk">Recusar pedido</button></div>');

  $('tSalvar').onclick=function(){
    var b=this, lista=Array.prototype.map.call(document.querySelectorAll('.tPreco'),function(i){ return {modelo:i.getAttribute('data-m'), preco:i.value.trim()}; });
    ocupado(b,true,'Salvando…');
    chamar('salvarPrecos',TOKEN,TAB_SEL==='(todos)'?'':TAB_SEL,lista).then(function(r){ D.precos=r.precos; guardar('elloin_dados',JSON.stringify(D)); aviso('Tabela salva. Os representantes recebem na próxima vez que abrirem o app com sinal.'); telaPrecos(); })
      .catch(function(e){ aviso(semSinal(e)?'Sem sinal: para salvar a tabela é preciso internet.':e.message,true); ocupado(b,false); });
  };
}

/* ---------------------------------------------------------------- GESTOR: representantes */
function telaUsuarios(){
  $('conteudo').innerHTML='<div class="card"><div class="linha"><h2 style="margin:0">Representantes e gestores</h2>'+
    '<button class="btn ouro" onclick="modalUsuario()">+ Novo usuário</button></div>'+
    '<table class="it"><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Na planilha</th><th>WhatsApp</th><th></th></tr>'+
    D.usuarios.map(function(u,k){ return '<tr style="'+(u.ativo?'':'opacity:.5')+'"><td>'+esc(u.nome)+'</td><td>'+esc(u.login)+'</td><td>'+esc(u.perfil)+'</td><td>'+esc(u.vendedor||'—')+'</td><td>'+esc(u.whats||'—')+'</td>'+
      '<td class="n"><button class="linkbtn" onclick="modalUsuario('+k+')">editar</button></td></tr>'; }).join('')+'</table>'+
    '<p class="dica">O nome "na planilha" (coluna Representantes da Cad_Listas) liga o representante aos clientes dele (ex.: vinicius → clientes vinicius/…). Cada um só enxerga os próprios clientes, pedidos, resumo e tabela de preços.</p></div>';
}
function modalUsuario(k){
  var u = k!=null ? D.usuarios[k] : {perfil:'rep',ativo:true};
  var vend = D.vendedores.length ? '<select id="uV"><option value="">—</option>'+D.vendedores.map(function(v){return '<option'+(v===u.vendedor?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select>'
                                 : '<input id="uV" value="'+esc(u.vendedor||'')+'" placeholder="ex.: vinicius">';
  abrirModal('<h2>'+(k!=null?'Editar usuário':'Novo usuário')+'</h2><div class="grade">'+
    '<div><label>Login</label><input id="uL" value="'+esc(u.login||'')+'"'+(k!=null?' readonly':'')+' autocapitalize="none"></div>'+
    '<div><label>Perfil</label><select id="uP"><option value="rep"'+(u.perfil==='rep'?' selected':'')+'>Representante</option><option value="gestor"'+(u.perfil==='gestor'?' selected':'')+'>Gestor</option></select></div>'+
    '<div class="tudo"><label>Nome</label><input id="uN" value="'+esc(u.nome||'')+'"></div>'+
    '<div><label>Representante na planilha (Cad_Listas)</label>'+vend+'</div>'+
    '<div><label>WhatsApp (com DDD)</label><input id="uW" inputmode="tel" value="'+esc(u.whats||'')+'"></div>'+
    '<div><label>'+(k!=null?'Nova senha (deixe vazio para manter)':'Senha')+'</label><input id="uS" type="text" autocomplete="new-password"></div>'+
    '<div><label>Acesso</label><select id="uA"><option value="1"'+(u.ativo?' selected':'')+'>Ativo</option><option value="0"'+(u.ativo?'':' selected')+'>Bloqueado</option></select></div>'+
    '</div><div class="acoes"><button class="btn claro" onclick="fecharModal()">Voltar</button><button class="btn prim" id="uOk">Salvar</button></div>');
  $('uOk').onclick=function(){
    var b=this; ocupado(b,true,'Salvando…');
    chamar('salvarUsuario',TOKEN,{login:$('uL').value,perfil:$('uP').value,nome:$('uN').value,vendedor:$('uV').value,whats:$('uW').value,senha:$('uS').value,ativo:$('uA').value==='1',novo:k==null})
      .then(function(r){ fecharModal(); aviso(r.msg); return recarregar(); }).catch(function(e){ aviso(semSinal(e)?'Sem sinal: é preciso internet.':e.message,true); ocupado(b,false); });
  };
}

/* ---------------------------------------------------------------- instalar no celular (para abrir sem sinal) */
var PROMPT_INSTALAR=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); PROMPT_INSTALAR=e; dicaInstalar(); });
function instalado(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
function dicaInstalar(){
  var el=$('dicaInst'); if(!el) return;
  if(instalado() || ler('elloin_dica_inst')==='nao'){ el.className='oculto'; return; }
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(PROMPT_INSTALAR) el.innerHTML='Para usar sem internet, instale o app neste aparelho. <button class="btn ouro" id="bInst">Instalar</button> <button class="linkbtn" id="bInstNao">agora não</button>';
  else if(ios) el.innerHTML='Para usar sem internet: toque em <b>Compartilhar</b> (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>. Abra sempre pelo ícone. <button class="linkbtn" id="bInstNao">ok</button>';
  else el.innerHTML='Para usar sem internet: no menu ⋮ do navegador, toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>. Abra sempre pelo ícone. <button class="linkbtn" id="bInstNao">ok</button>';
  el.className='dicainst';
  if($('bInst')) $('bInst').onclick=function(){ PROMPT_INSTALAR.prompt(); PROMPT_INSTALAR=null; el.className='oculto'; };
  if($('bInstNao')) $('bInstNao').onclick=function(){ guardar('elloin_dica_inst','nao'); el.className='oculto'; };
}

/* ---------------------------------------------------------------- início */
(function(){ try{ var d=document.createElement('div'); d.style.display='flex'; d.style.flexDirection='column'; d.style.rowGap='1px';
  d.appendChild(document.createElement('div')); d.appendChild(document.createElement('div')); document.body.appendChild(d);
  var ok=d.scrollHeight===1; d.parentNode.removeChild(d); if(!ok) document.documentElement.className+=' semgap'; }catch(e){} })();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
}
$('conteudo').addEventListener('input',function(e){ if(e.target && e.target.id!=='mF' && e.target.id!=='rMes' && e.target.id!=='tSel' && ['hS','hR','hQ'].indexOf(e.target.id)<0) FORM_SUJO=true; });
$('conteudo').addEventListener('change',function(e){ if(e.target && /^aj_|^pCliente$|^tPreco/.test(e.target.id||e.target.className)) FORM_SUJO=true; });
ONLINE = navigator.onLine!==false;
TOKEN = ler('elloin_token');
if (TOKEN) iniciar(); else mostrarLogin();
